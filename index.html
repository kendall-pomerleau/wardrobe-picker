<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wardrobe Picker</title>
    <link rel="manifest" href="./manifest.json">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        [x-cloak] {
            display: none !important;
        }
    </style>
    <style>
        [x-cloak] {
            display: none !important;
        }

        /* Elegant Serif Font: Cormorant Garamond */
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap');

        :root {
            --warm-cream: #fdfaf6;
            --sage-soft: #e3e8de;
            --muted-forest: #5a6e5a;
            /* Muted, earthy button color */
            --text-deep: #4a5349;
        }

        body {
            background-color: var(--warm-cream) !important;
            font-family: 'Cormorant Garamond', serif !important;
            color: var(--text-deep) !important;
        }

        /* Apply the cream background to the app container */
        .bg-slate-50 {
            background-color: var(--warm-cream) !important;
        }

        .bg-white {
            background-color: #ffffff !important;
            border: 1px solid #f0ede9 !important;
        }

        /* Muted Sage Accents */
        .bg-indigo-600 {
            background-color: var(--muted-forest) !important;
        }

        .text-indigo-600 {
            color: var(--muted-forest) !important;
        }

        /* Fix the Save button: Override emerald-500 */
        .bg-emerald-500 {
            background-color: var(--muted-forest) !important;
        }

        .hover\:bg-emerald-600:hover {
            background-color: #455645 !important;
        }

        .bg-emerald-50 {
            background-color: var(--sage-soft) !important;
        }

        .text-emerald-600 {
            color: var(--muted-forest) !important;
        }

        .border-emerald-200 {
            border-color: var(--sage-soft) !important;
        }
    </style>
    <link rel="apple-touch-icon" href="assets/hanger_icon.png">
    <link rel="icon" type="image/png" href="assets/hanger_icon.png">
</head>

<body class="bg-slate-50 text-slate-800 font-sans antialiased">

    <div x-data="wardrobeApp()" x-init="init()" class="max-w-md mx-auto p-6 min-h-screen flex flex-col justify-between">

        <header class="text-center py-4">
            <h1 class="text-4xl font-bold text-[#5a6e5a] tracking-wide">Closet Seed</h1>
            <p class="text-sm text-slate-500 mt-1">Roll your seed items; pair with your basics</p>

            <div class="flex justify-center space-x-2 mt-4 bg-slate-200 p-1 rounded-xl">
                <button @click="currentView = 'roll'"
                    :class="currentView === 'roll' ? 'bg-white text-indigo-600 shadow-xs' : 'text-slate-600'"
                    class="flex-1 py-2 text-xs font-semibold rounded-lg transition-all cursor-pointer">🎲 Roll</button>
                <button @click="currentView = 'add'"
                    :class="currentView === 'add' ? 'bg-white text-indigo-600 shadow-xs' : 'text-slate-600'"
                    class="flex-1 py-2 text-xs font-semibold rounded-lg transition-all cursor-pointer">➕ Add</button>
                <button @click="currentView = 'manage'"
                    :class="currentView === 'manage' ? 'bg-white text-indigo-600 shadow-xs' : 'text-slate-600'"
                    class="flex-1 py-2 text-xs font-semibold rounded-lg transition-all cursor-pointer">📋
                    Manage</button>
            </div>
        </header>

        <template x-if="currentView === 'roll'">
            <main class="flex-grow flex flex-col justify-center my-4 space-y-4">

                <div class="bg-white p-4 rounded-2xl shadow-xs border border-slate-100 space-y-3">

                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1.5">Tags /
                            Occasion</label>
                        <div
                            class="bg-slate-50 p-3 rounded-xl max-h-28 overflow-y-auto grid grid-cols-2 gap-2 border border-slate-100">
                            <template x-for="tag in availableTags" :key="tag">
                                <label
                                    class="flex items-center space-x-2 text-xs font-medium text-slate-700 cursor-pointer">
                                    <input type="checkbox" :value="tag" x-model="selectedTags"
                                        class="rounded text-indigo-600 focus:ring-indigo-500 border-none bg-slate-200 w-4 h-4">
                                    <span x-text="tag"></span>
                                </label>
                            </template>
                            <template x-if="availableTags.length === 0">
                                <p class="text-[11px] text-slate-400 italic col-span-2">No tags found in database yet.
                                </p>
                            </template>
                        </div>
                    </div>

                    <div>
                        <label
                            class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Color</label>
                        <select x-model="selectedColor"
                            class="w-full p-3 rounded-xl bg-slate-100 border-none text-sm focus:ring-2 focus:ring-indigo-500">
                            <option value="">Any Color</option>
                            <template x-for="color in availableColors" :key="color">
                                <option :value="color" x-text="color"></option>
                            </template>
                        </select>
                    </div>
                </div>

                <div
                    class="bg-indigo-600 text-white p-6 rounded-3xl shadow-xl min-h-[280px] flex flex-col justify-center items-center text-center relative overflow-hidden transition-all duration-300">
                    <template x-if="rolledItem">
                        <div class="flex flex-col items-center space-y-4 w-full">

                            <template x-if="rolledItem.image">
                                <img :src="rolledItem.image" alt="Outfit item"
                                    class="w-28 h-28 object-cover rounded-2xl border-2 border-indigo-400 shadow-md">
                            </template>

                            <div>
                                <div class="flex flex-col items-center gap-1">
                                    <span
                                        class="text-xs font-bold uppercase tracking-widest bg-indigo-500 px-3 py-1 rounded-full text-indigo-100"
                                        x-text="rolledItem.category"></span>
                                    <span x-show="tagMatchMessage" class="text-[10px] text-amber-300 font-medium"
                                        x-text="tagMatchMessage"></span>
                                </div>

                                <h2 class="text-2xl font-bold mt-2" x-text="rolledItem.name"></h2>
                                <p class="text-xs text-indigo-200 mt-1"
                                    x-text="'Color: ' + rolledItem.color + ' • ' + (rolledItem.tags && Array.isArray(rolledItem.tags) ? rolledItem.tags.join(', ') : rolledItem.tags)">
                                </p>

                                <p x-show="rolledItem.notes"
                                    class="text-xs italic bg-indigo-700/50 text-indigo-100 px-4 py-2 rounded-xl mt-3 max-w-xs mx-auto"
                                    x-text="'💡 ' + rolledItem.notes"></p>

                                <template x-if="getPairedItems(rolledItem).length > 0">
                                    <div class="mt-3 pt-2 border-t border-indigo-500/30">
                                        <p class="text-[10px] uppercase tracking-wider text-indigo-200 font-bold">🔥
                                            Suggested Basics &amp; Pairings:</p>
                                        <p class="text-xs font-medium text-white mt-0.5"
                                            x-text="getPairedItems(rolledItem).map(i => i.name).join(', ')"></p>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </template>
                    <template x-if="!rolledItem">
                        <p class="text-indigo-100 font-medium">Ready to roll? Pick your criteria above.</p>
                    </template>
                </div>
            </main>
        </template>

        <template x-if="currentView === 'add'">
            <main class="flex-grow my-4 bg-white p-6 rounded-2xl shadow-xs border border-slate-100 space-y-4">
                <h2 class="text-xl font-bold text-slate-800 mb-2">Add New Clothing Item</h2>

                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Item Name</label>
                    <input type="text" x-model="newItem.name" placeholder="e.g., Uniqlo Oxford Shirt"
                        class="w-full p-3 rounded-xl bg-slate-100 border-none text-sm focus:ring-2 focus:ring-indigo-500">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Category</label>
                        <select x-model="newItem.category"
                            class="w-full p-3 rounded-xl bg-slate-100 border-none text-sm focus:ring-2 focus:ring-indigo-500">
                            <option value="top">top</option>
                            <option value="bottom">bottom</option>
                            <option value="jacket">jacket</option>
                            <option value="pajamas">pajamas</option>
                            <option value="dress">dress</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Primary Color</label>
                        <input type="text" x-model="newItem.color" placeholder="e.g., blue"
                            class="w-full p-3 rounded-xl bg-slate-100 border-none text-sm focus:ring-2 focus:ring-indigo-500">
                    </div>
                </div>

                <div class="bg-slate-50 p-3 rounded-xl flex items-center justify-between">
                    <div>
                        <label class="block text-xs font-bold text-slate-700">Is this item a "Basic"?</label>
                        <p class="text-[10px] text-slate-400">Basics are hidden from rolls, but available for pairings.
                        </p>
                    </div>
                    <input type="checkbox" x-model="newItem.is_basic"
                        class="w-5 h-5 rounded text-indigo-600 focus:ring-indigo-500 border-slate-300 bg-white">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Tags (Comma-separated)</label>
                    <input type="text" x-model="newItem.tagsRaw" placeholder="e.g., work, casual, summer"
                        class="w-full p-3 rounded-xl bg-slate-100 border-none text-sm focus:ring-2 focus:ring-indigo-500">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Upload Photo</label>
                    <input type="file" accept="image/*" @change="uploadImage($event, false)"
                        class="w-full p-3 rounded-xl bg-slate-100 border-none text-sm file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">
                    <p x-show="uploading" class="text-xs text-indigo-500 mt-1 animate-pulse">Uploading to Supabase
                        Storage...</p>
                </div>

                <button @click="addItem()"
                    class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 px-4 rounded-xl shadow-md transition-all mt-4 cursor-pointer">
                    Save to Wardrobe
                </button>

                <p class="text-center text-xs text-slate-400 mt-4" x-text="'Total items in closet: ' + wardrobe.length">
                </p>
            </main>
        </template>

        <template x-if="currentView === 'manage'">
            <main class="flex-grow my-4 space-y-4">
                <div class="bg-white p-4 rounded-2xl shadow-xs border border-slate-100 mb-4">
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Filter by
                        Tags</label>
                    <div class="grid grid-cols-2 gap-2 max-h-32 overflow-y-auto">
                        <template x-for="tag in availableTags" :key="tag">
                            <label
                                class="flex items-center space-x-2 text-xs font-medium text-slate-700 cursor-pointer">
                                <input type="checkbox" :value="tag" x-model="selectedTags"
                                    class="rounded text-indigo-600 focus:ring-indigo-500 border-none bg-slate-200 w-4 h-4">
                                <span x-text="tag"></span>
                            </label>
                        </template>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[10px] font-bold uppercase text-slate-400 mb-1">Category</label>
                        <select x-model="selectedCategory"
                            class="w-full p-2 rounded-xl bg-slate-50 border-none text-sm focus:ring-2 focus:ring-indigo-500">
                            <option value="">All Categories</option>
                            <template x-for="cat in ['top', 'bottom', 'jacket', 'pajamas', 'dress']" :key="cat">
                                <option :value="cat" x-text="cat"></option>
                            </template>
                        </select>
                    </div>

                    <div>
                        <label class="block text-[10px] font-bold uppercase text-slate-400 mb-1">Color</label>
                        <select x-model="selectedColor"
                            class="w-full p-2 rounded-xl bg-slate-50 border-none text-sm focus:ring-2 focus:ring-indigo-500">
                            <option value="">All Colors</option>
                            <template x-for="color in availableColors" :key="color">
                                <option :value="color" x-text="color"></option>
                            </template>
                        </select>
                    </div>
                </div>
                <div class="search-container">
                    <input type="text" x-model="searchQuery" placeholder="Search your closet..." class="search-bar" />
                </div>
                <h2 class="text-xl font-bold text-slate-800">Your Closet Inventory</h2>

                <div class="grid grid-cols-1 gap-3">
                    <template x-for="item in filteredItems" :key="item.id">
                        <div class="bg-white p-4 rounded-2xl shadow-xs border border-slate-100 flex flex-col space-y-3">
                            <div class="flex items-center justify-between">
                                <div class="flex items-center space-x-3">
                                    <div
                                        class="w-14 h-14 bg-slate-100 rounded-xl overflow-hidden flex items-center justify-center border border-slate-200 shrink-0">
                                        <template x-if="item.image">
                                            <img :src="item.image" class="w-full h-full object-cover">
                                        </template>
                                        <template x-if="!item.image">
                                            <span class="text-2xl text-slate-400">👕</span>
                                        </template>
                                    </div>
                                    <div>
                                        <div class="flex items-center space-x-1.5">
                                            <h3 class="font-bold text-sm text-slate-800" x-text="item.name"></h3>
                                            <span x-show="item.is_basic"
                                                class="text-[9px] font-bold uppercase tracking-wider bg-slate-100 text-slate-500 border border-slate-200 px-1.5 py-0.5 rounded-md">Basic</span>
                                            <span x-show="!item.is_basic"
                                                class="text-[9px] font-bold uppercase tracking-wider bg-indigo-50 text-indigo-500 border border-indigo-100 px-1.5 py-0.5 rounded-md">Seed</span>
                                        </div>
                                        <p class="text-xs text-slate-400 mt-0.5"
                                            x-text="item.color + ' • ' + item.category"></p>
                                        <div class="flex flex-wrap gap-1 mt-1">
                                            <template
                                                x-for="tag in (Array.isArray(item.tags) ? item.tags : (item.tags ? item.tags.split(',') : []))"
                                                :key="tag">
                                                <span
                                                    class="text-[10px] bg-slate-100 text-slate-600 px-1.5 py-0.5 rounded-md"
                                                    x-text="tag.trim()"></span>
                                            </template>
                                        </div>
                                        <p x-show="history[item.id]"
                                            class="text-[10px] font-medium text-emerald-600 mt-1"
                                            x-text="'📅 Last logged: ' + new Date(history[item.id]).toLocaleDateString()">
                                        </p>
                                    </div>
                                </div>

                                <div class="flex flex-col items-end space-y-2 shrink-0 self-start">
                                    <div class="flex space-x-1">
                                        <button @click="openEditModal(item)"
                                            class="p-2 text-indigo-600 hover:bg-indigo-50 rounded-lg text-sm font-medium cursor-pointer"
                                            title="Edit">✏️</button>
                                        <button @click="deleteItem(item.id)"
                                            class="p-2 text-rose-600 hover:bg-rose-50 rounded-lg text-sm font-medium cursor-pointer"
                                            title="Delete">🗑️</button>
                                    </div>
                                    <button @click="quickLogWear(item)"
                                        class="text-[10px] bg-emerald-50 text-emerald-600 hover:bg-emerald-100 border border-emerald-200 font-bold px-2 py-1 rounded-lg transition-all cursor-pointer">
                                        📆 Mark Worn
                                    </button>
                                </div>
                            </div>

                            <div class="text-xs border-t border-slate-100 pt-2 space-y-1 bg-slate-50/50 p-2 rounded-xl"
                                x-show="item.notes || (item.pairs_with && item.pairs_with.length > 0)">
                                <template x-if="item.notes">
                                    <p class="text-slate-600"><span class="font-semibold text-slate-400">Notes:</span>
                                        <span x-text="item.notes"></span>
                                    </p>
                                </template>
                                <template x-if="item.pairs_with && item.pairs_with.length > 0">
                                    <p class="text-indigo-600"><span class="font-semibold text-slate-400">Pairs
                                            with:</span> <span class="font-medium"
                                            x-text="getPairedItems(item).map(i => i.name).join(', ')"></span></p>
                                </template>
                            </div>

                        </div>
                    </template>
                </div>
            </main>
        </template>

        <footer class="space-y-3 pb-6">
            <template x-if="currentView === 'roll'">
                <div class="space-y-3 w-full">
                    <button @click="roll()"
                        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 px-6 rounded-2xl shadow-lg transform active:scale-95 transition-all text-center cursor-pointer">
                        <span x-text="rolledItem ? '🎲 Re-Roll Seed' : '🎲 Roll Outfit Seed'"></span>
                    </button>

                    <template x-if="rolledItem">
                        <button @click="acceptOutfit()"
                            class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-semibold py-3 px-6 rounded-2xl transition-all text-center cursor-pointer">
                            ✅ Wear This Today
                        </button>
                    </template>
                </div>
            </template>
        </footer>

        <div x-show="isEditModalOpen"
            class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs flex items-center justify-center p-4 z-50 overflow-y-auto"
            x-cloak>
            <div class="bg-white rounded-3xl p-6 w-full max-w-sm space-y-4 shadow-xl my-8"
                @click.away="isEditModalOpen = false">
                <div class="flex justify-between items-center">
                    <h3 class="text-lg font-bold text-slate-900">Modify Clothing Item</h3>
                    <button @click="isEditModalOpen = false"
                        class="text-slate-400 text-xl font-bold cursor-pointer">&times;</button>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Item Name</label>
                    <input type="text" x-model="editingItem.name"
                        class="w-full p-3 rounded-xl bg-slate-100 border-none text-sm focus:ring-2 focus:ring-indigo-500">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Category</label>
                        <select x-model="editingItem.category"
                            class="w-full p-3 rounded-xl bg-slate-100 border-none text-sm focus:ring-2 focus:ring-indigo-500">
                            <option value="top">top</option>
                            <option value="bottom">bottom</option>
                            <option value="jacket">jacket</option>
                            <option value="pajamas">pajamas</option>
                            <option value="dress">dress</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Color</label>
                        <input type="text" x-model="editingItem.color"
                            class="w-full p-3 rounded-xl bg-slate-100 border-none text-sm focus:ring-2 focus:ring-indigo-500">
                    </div>
                </div>

                <div class="bg-slate-50 p-3 rounded-xl flex items-center justify-between">
                    <div>
                        <label class="block text-xs font-bold text-slate-700">Is this item a "Basic"?</label>
                        <p class="text-[10px] text-slate-400">If checked, this item will never show up on rolls.</p>
                    </div>
                    <input type="checkbox" x-model="editingItem.is_basic"
                        class="w-5 h-5 rounded text-indigo-600 focus:ring-indigo-500 border-slate-300 bg-white">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Tags (Comma-separated)</label>
                    <input type="text" x-model="editingItem.tagsRaw"
                        class="w-full p-3 rounded-xl bg-slate-100 border-none text-sm focus:ring-2 focus:ring-indigo-500">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Styling Notes / Rules</label>
                    <textarea x-model="editingItem.notes" placeholder="e.g., Only wear with high-waisted pants."
                        class="w-full p-3 rounded-xl bg-slate-100 border-none text-sm focus:ring-2 focus:ring-indigo-500 h-16 resize-none"></textarea>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Pairs Nicely With:</label>
                    <div class="bg-slate-100 p-3 rounded-xl max-h-28 overflow-y-auto space-y-2">
                        <template x-for="closetItem in wardrobe.filter(i => i.id !== editingItem.id)"
                            :key="closetItem.id">
                            <label
                                class="flex items-center space-x-2 text-xs font-medium text-slate-700 cursor-pointer">
                                <input type="checkbox" :value="closetItem.id" x-model="editingItem.pairs_with"
                                    class="rounded text-indigo-600 focus:ring-indigo-500 border-none bg-slate-200">
                                <span x-text="closetItem.name + ' (' + closetItem.color + ')'"></span>
                            </label>
                        </template>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Update Photo</label>
                    <input type="file" accept="image/*" @change="uploadImage($event, true)"
                        class="w-full p-2 text-xs bg-slate-100 rounded-xl file:mr-2 file:py-1 file:px-3 file:rounded-full file:border-0 file:text-xs file:bg-indigo-50 file:text-indigo-700">
                    <p x-show="uploading" class="text-xs text-indigo-500 mt-1 animate-pulse">Uploading new image...</p>
                </div>

                <button @click="saveItemEdits()"
                    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-xl shadow-md transition-all cursor-pointer">
                    💾 Update Item
                </button>
            </div>
        </div>

    </div>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js');
        }

        const SUPABASE_URL = 'https://hymatbsqzyfndforwedh.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_yyP_AP764oE4MCWGHd0yeQ_2nfkXaRP';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        function wardrobeApp() {
            return {
                searchQuery: '',
                currentView: 'roll',
                wardrobe: [],
                history: {},
                selectedTags: [],
                selectedCategory: '',
                selectedColor: '',
                rolledItem: null,
                ignoredIds: [],
                availableTags: [],
                availableColors: [],
                uploading: false,
                tagMatchMessage: '',

                newItem: { name: '', category: 'top', color: '', tagsRaw: '', image: '', is_basic: false },
                isEditModalOpen: false,
                editingItem: { id: null, name: '', category: 'top', color: '', tagsRaw: '', image: '', notes: '', pairs_with: [], is_basic: false },

                async init() {
                    const { data: clothes, error: cErr } = await supabaseClient
                        .from('wardrobe')
                        .select('*');
                    if (!cErr) this.wardrobe = clothes || [];

                    const { data: log, error: hErr } = await supabaseClient
                        .from('history')
                        .select('item_id, last_worn');

                    if (!hErr && log) {
                        this.history = log.reduce((acc, row) => {
                            if (!acc[row.item_id] || new Date(row.last_worn) > new Date(acc[row.item_id])) {
                                acc[row.item_id] = row.last_worn;
                            }
                            return acc;
                        }, {});
                    }

                    this.updateDropdownFilters();
                },

                filteredItems() {
                    const query = this.searchQuery.toLowerCase();

                    return this.wardrobe.filter(item => {
                        const matchesSearch = query === '' ||
                            item.name.toLowerCase().includes(query) ||
                            (item.notes && item.notes.toLowerCase().includes(query)) ||
                            item.category.toLowerCase().includes(query);

                        const matchesColor = this.selectedColor === '' ||
                            (item.color && item.color.toLowerCase() === this.selectedColor.toLowerCase());

                        // New Category filter
                        const matchesCategory = this.selectedCategory === '' ||
                            (item.category && item.category.toLowerCase() === this.selectedCategory.toLowerCase());

                        const matchesTags = this.selectedTags.length === 0 ||
                            this.selectedTags.every(t => {
                                const itemTags = Array.isArray(item.tags) ? item.tags : String(item.tags).replace(/[\{\}\[\]\"]/g, '').split(',');
                                return itemTags.map(tag => tag.trim().toLowerCase()).includes(t.toLowerCase());
                            });

                        return matchesSearch && matchesColor && matchesCategory && matchesTags;
                    });
                },

                updateDropdownFilters() {
                    const tagsSet = new Set();
                    const colorsSet = new Set();
                    this.wardrobe.forEach(item => {
                        if (item.tags) {
                            const tagsString = Array.isArray(item.tags) ? item.tags.join(',') : String(item.tags);
                            const cleanString = tagsString.replace(/[\{\}\[\]\"]/g, '');

                            cleanString.split(',').forEach(t => {
                                if (t && t.trim().length > 0) tagsSet.add(t.trim().toLowerCase());
                            });
                        }
                        if (item.color) colorsSet.add(String(item.color).toLowerCase().trim());
                    });

                    // Custom ordering: Seasons first, then Occasions
                    const customOrder = [
                        'spring', 'summer', 'fall', 'winter', // Seasons
                        'work', 'casual', 'wfh', 'going out'  // Occasions
                    ];

                    const allTags = Array.from(tagsSet);

                    this.availableTags = allTags.sort((a, b) => {
                        const indexA = customOrder.indexOf(a);
                        const indexB = customOrder.indexOf(b);

                        // If both are in our custom list, sort by their position in that list
                        if (indexA !== -1 && indexB !== -1) return indexA - indexB;
                        // If only one is in the custom list, it gets priority
                        if (indexA !== -1) return -1;
                        if (indexB !== -1) return 1;
                        // Everything else remains alphabetical
                        return a.localeCompare(b);
                    });

                    this.availableColors = Array.from(colorsSet).sort();
                },

                getPairedItems(item) {
                    if (!item || !item.pairs_with) return [];
                    return this.wardrobe.filter(i => item.pairs_with.map(Number).includes(Number(i.id)));
                },

                async uploadImage(event, isEditing = false) {
                    const file = event.target.files[0];
                    if (!file) return;

                    this.uploading = true;
                    const fileExt = file.name.split('.').pop();
                    const fileName = `${Date.now()}.${fileExt}`;

                    const { data, error } = await supabaseClient.storage
                        .from('wardrobe-images')
                        .upload(fileName, file);

                    if (error) {
                        alert('Cloud upload failed: ' + error.message);
                        this.uploading = false;
                        return;
                    }

                    const { data: urlData } = supabaseClient.storage
                        .from('wardrobe-images')
                        .getPublicUrl(fileName);

                    console.log("Generated Public URL:", urlData.publicUrl); // ADD THIS LINE

                    if (isEditing) {
                        this.editingItem.image = urlData.publicUrl;
                    } else {
                        this.newItem.image = urlData.publicUrl;
                    }
                    this.uploading = false;
                },

                async addItem() {
                    if (!this.newItem.name || !this.newItem.color) {
                        alert("Name and Color are required fields.");
                        return;
                    }
                    if (this.uploading) {
                        alert("Please wait for your snapshot to complete uploading.");
                        return;
                    }

                    const cleanTags = this.newItem.tagsRaw.split(',').map(t => t.trim().toLowerCase()).filter(t => t.length > 0);

                    const { data, error } = await supabaseClient
                        .from('wardrobe')
                        .insert([{
                            name: this.newItem.name,
                            category: this.newItem.category.toLowerCase(),
                            color: this.newItem.color.trim().toLowerCase(),
                            tags: cleanTags,
                            image: this.newItem.image,
                            is_basic: this.newItem.is_basic
                        }])
                        .select();

                    if (!error && data) {
                        this.wardrobe.push(data[0]);
                        this.updateDropdownFilters();
                        this.newItem = { name: '', category: 'top', color: '', tagsRaw: '', image: '', is_basic: false };
                        alert(`${data[0].name} successfully added to cloud registry!`);
                        this.currentView = 'roll';
                    } else {
                        alert("Database entry error: " + error.message);
                    }
                },

                openEditModal(item) {
                    let rawTagsString = '';
                    if (item.tags) {
                        rawTagsString = Array.isArray(item.tags) ? item.tags.join(', ') : item.tags;
                    }

                    this.editingItem = {
                        id: item.id,
                        name: item.name,
                        category: item.category.toLowerCase(),
                        color: item.color.toLowerCase(),
                        image: item.image || '',
                        notes: item.notes || '',
                        is_basic: !!item.is_basic,
                        pairs_with: item.pairs_with ? item.pairs_with.map(Number) : [],
                        tagsRaw: rawTagsString
                    };
                    this.isEditModalOpen = true;
                },

                async saveItemEdits() {
                    if (!this.editingItem.name || !this.editingItem.color) return;
                    if (this.uploading) return;

                    const cleanTags = this.editingItem.tagsRaw.split(',').map(t => t.trim().toLowerCase()).filter(t => t.length > 0);

                    // LOG THE OBJECT BEING SENT
                    const updateData = {
                        name: this.editingItem.name,
                        category: this.editingItem.category.toLowerCase(),
                        color: this.editingItem.color.trim().toLowerCase(),
                        tags: cleanTags,
                        image: this.editingItem.image, // Check if this is a valid URL string
                        notes: this.editingItem.notes.trim(),
                        pairs_with: this.editingItem.pairs_with,
                        is_basic: this.editingItem.is_basic
                    };

                    console.log("Updating Row ID:", this.editingItem.id);
                    console.log("Sending Data:", updateData);

                    const { error, count } = await supabaseClient
                        .from('wardrobe')
                        .update(updateData)
                        .eq('id', this.editingItem.id);

                    console.log("Update complete. Error:", error);
                    if (!error) {
                        const index = this.wardrobe.findIndex(i => i.id === this.editingItem.id);
                        if (index !== -1) {
                            this.wardrobe[index] = {
                                ...this.wardrobe[index],
                                name: this.editingItem.name,
                                category: this.editingItem.category.toLowerCase(),
                                color: this.editingItem.color.trim().toLowerCase(),
                                tags: cleanTags,
                                image: this.editingItem.image,
                                notes: this.editingItem.notes.trim(),
                                pairs_with: this.editingItem.pairs_with,
                                is_basic: this.editingItem.is_basic
                            };
                        }
                        this.updateDropdownFilters();
                        this.isEditModalOpen = false;
                        alert("Changes saved to cloud successfully!");
                        this.editingItem.image = '';
                    } else {
                        console.error("SUPABASE ERROR:", error); // Logs the real reason to the console
                        alert("Error updating row: " + error.message);
                    }
                },

                async deleteItem(id) {
                    if (!confirm("Are you sure you want to remove this item from your closet?")) return;

                    const { error } = await supabaseClient
                        .from('wardrobe')
                        .delete()
                        .eq('id', id);

                    if (!error) {
                        this.wardrobe = this.wardrobe.filter(item => item.id !== id);
                        this.updateDropdownFilters();
                    } else {
                        alert("Delete action failed: " + error.message);
                    }
                },

                roll() {
                    this.tagMatchMessage = '';

                    let basePool = this.wardrobe.filter(item => {
                        const isSeed = !item.is_basic;
                        const matchColor = this.selectedColor ? item.color === this.selectedColor : true;
                        const notIgnored = !this.ignoredIds.includes(item.id);
                        return isSeed && matchColor && notIgnored;
                    });

                    if (basePool.length === 0) {
                        alert("No wardrobe elements map to this color / criteria!");
                        this.ignoredIds = [];
                        return;
                    }

                    let finalPool = [];

                    if (this.selectedTags.length > 0) {
                        let scoredPool = basePool.map(item => {
                            let itemTagsArray = [];
                            if (item.tags) {
                                if (Array.isArray(item.tags)) itemTagsArray = item.tags;
                                else if (typeof item.tags === 'string') itemTagsArray = item.tags.split(',').map(t => t.trim().toLowerCase());
                            }
                            const matchCount = this.selectedTags.filter(t => itemTagsArray.includes(t)).length;
                            return { item, matchCount };
                        });

                        const maxMatch = Math.max(...scoredPool.map(p => p.matchCount));

                        if (maxMatch === this.selectedTags.length) {
                            this.tagMatchMessage = `✨ Perfect match (${maxMatch}/${this.selectedTags.length} tags)`;
                        } else if (maxMatch > 0) {
                            this.tagMatchMessage = `⚠️ Partial match fallback (${maxMatch}/${this.selectedTags.length} tags)`;
                        } else {
                            this.tagMatchMessage = `🚫 No matching tags! Showing overall items instead`;
                        }

                        finalPool = scoredPool.filter(p => p.matchCount === maxMatch).map(p => p.item);
                    } else {
                        finalPool = basePool;
                    }

                    const now = new Date();
                    const threeWeeksAgo = new Date(now.getTime() - (21 * 24 * 60 * 60 * 1000));

                    let cooledDownPool = finalPool.filter(item => {
                        if (!this.history[item.id]) return true;
                        return new Date(this.history[item.id]) < threeWeeksAgo;
                    });

                    let finalSelection;

                    if (cooledDownPool.length === 0) {
                        finalPool.sort((a, b) => {
                            const dateA = this.history[a.id] ? new Date(this.history[a.id]) : new Date(0);
                            const dateB = this.history[b.id] ? new Date(this.history[b.id]) : new Date(0);
                            return dateA - dateB;
                        });
                        finalSelection = finalPool[0];
                    } else {
                        finalSelection = cooledDownPool[Math.floor(Math.random() * cooledDownPool.length)];
                    }

                    if (this.rolledItem) this.ignoredIds.push(this.rolledItem.id);
                    this.rolledItem = finalSelection;
                },

                async acceptOutfit() {
                    if (!this.rolledItem) return;

                    const { error } = await supabaseClient
                        .from('history')
                        .insert([{ item_id: this.rolledItem.id }]);

                    if (!error) {
                        this.history[this.rolledItem.id] = new Date().toISOString();
                        alert(`Transaction confirmed. Have a good day in your ${this.rolledItem.name}!`);
                        this.rolledItem = null;
                        this.ignoredIds = [];
                        this.tagMatchMessage = '';
                    } else {
                        alert("History commit failed: " + error.message);
                    }
                },

                async quickLogWear(item) {
                    if (!confirm(`Did you manually wear "${item.name}" recently? This pushes it to the back of the rotation cooldown.`)) return;

                    const { error } = await supabaseClient
                        .from('history')
                        .insert([{ item_id: item.id }]);

                    if (!error) {
                        this.history[item.id] = new Date().toISOString();
                        alert(`Logged! "${item.name}" won't show up on standard rolls for 3 weeks.`);
                    } else {
                        alert("Failed to manually record wear history: " + error.message);
                    }
                }
            }
        }
    </script>
